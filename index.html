<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕГЭ Трекер 85+</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-math: #4facfe;
            --accent-info: #00f260;
            --accent-rus: #ff9a9e;
            --done-color: #2ecc71;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; text-align: center; }
        .stats {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        .progress-bar {
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f260);
            width: 0%;
            transition: width 0.5s ease;
        }
        .schedule-container {
            width: 100%;
            max-width: 400px;
        }
        .day-card {
            background: var(--card-bg);
            margin-bottom: 15px;
            border-radius: 12px;
            padding: 15px;
            border-left: 5px solid transparent;
        }
        .day-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .task {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .task:hover { background: rgba(255,255,255,0.1); }
        .task.done {
            opacity: 0.5;
            text-decoration: line-through;
        }
        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #555;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .task.done .checkbox {
            background: var(--done-color);
            border-color: var(--done-color);
        }
        .task.done .checkbox::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }
        
        /* Цвета предметов */
        .math-border { border-left-color: var(--accent-math); }
        .info-border { border-left-color: var(--accent-info); }
        .rus-border { border-left-color: var(--accent-rus); }
        .rest-border { border-left-color: #888; }

        .tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
            color: #121212;
            font-weight: bold;
        }
        .tag.math { background: var(--accent-math); }
        .tag.info { background: var(--accent-info); }
        .tag.rus { background: var(--accent-rus); }
        
        button.reset-btn {
            margin-top: 30px;
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>🎯 Цель: 85+ баллов</h1>
    
    <div class="stats">
        <div>Прогресс недели: <span id="hours-done">0</span> / 22 ч</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="schedule-container" id="schedule">
        <!-- Сюда JavaScript вставит расписание -->
    </div>

    <button class="reset-btn" onclick="resetWeek()">Сбросить неделю</button>

    <script>
        // Твое расписание
        const scheduleData = [
            { day: "Понедельник", type: "math", tasks: [
                { name: "Новая тема + 5 задач", hours: 3, done: false }
            ]},
            { day: "Вторник", type: "info", tasks: [
                { name: "Python (задачи 17, 24-26)", hours: 3, done: false }
            ]},
            { day: "Среда", type: "math", tasks: [
                { name: "Геометрия / 1 часть", hours: 3, done: false }
            ]},
            { day: "Четверг", type: "rus", tasks: [
                { name: "Тест + план сочинения", hours: 2.5, done: false }
            ]},
            { day: "Пятница", type: "info", tasks: [
                { name: "Логика, системы счисления", hours: 3, done: false }
            ]},
            { day: "Суббота", type: "math", tasks: [
                { name: "ПРОБНИК + разбор ошибок", hours: 5, done: false }
            ]},
            { day: "Воскресенье", type: "rest", tasks: [
                { name: "ПОЛНЫЙ ОТДЫХ 🛌", hours: 0, done: false }
            ]}
        ];

        const container = document.getElementById('schedule');
        const hoursDisplay = document.getElementById('hours-done');
        const progressFill = document.getElementById('progress-fill');

        // Загрузка состояния из памяти
        function loadState() {
            const saved = localStorage.getItem('egeSchedule');
            if (saved) {
                const parsed = JSON.parse(saved);
                // Обновляем статусы задач
                parsed.forEach((dayData, dayIndex) => {
                    dayData.tasks.forEach((task, taskIndex) => {
                        if (scheduleData[dayIndex].tasks[taskIndex]) {
                            scheduleData[dayIndex].tasks[taskIndex].done = task.done;
                        }
                    });
                });
            }
            render();
        }

        function saveState() {
            localStorage.setItem('egeSchedule', JSON.stringify(scheduleData));
            updateStats();
        }

        function toggleTask(dayIndex, taskIndex) {
            scheduleData[dayIndex].tasks[taskIndex].done = !scheduleData[dayIndex].tasks[taskIndex].done;
            saveState();
            render();
        }

        function updateStats() {
            let totalHours = 0;
            scheduleData.forEach(day => {
                day.tasks.forEach(task => {
                    if (task.done) totalHours += task.hours;
                });
            });
            hoursDisplay.innerText = totalHours;
            const percent = Math.min((totalHours / 22) * 100, 100);
            progressFill.style.width = percent + "%";
        }

        function resetWeek() {
            if(confirm("Сбросить все галочки за эту неделю?")) {
                scheduleData.forEach(day => {
                    day.tasks.forEach(task => task.done = false);
                });
                saveState();
                render();
            }
        }

        function render() {
            container.innerHTML = '';
            scheduleData.forEach((day, dayIndex) => {
                const dayCard = document.createElement('div');
                dayCard.className = `day-card ${day.type}-border`;
                
                let tasksHtml = '';
                day.tasks.forEach((task, taskIndex) => {
                    tasksHtml += `
                        <div class="task ${task.done ? 'done' : ''}" onclick="toggleTask(${dayIndex}, ${taskIndex})">
                            <div class="checkbox"></div>
                            <span>${task.name}</span>
                            ${task.hours > 0 ? `<span class="tag ${day.type}">${task.hours}ч</span>` : ''}
                        </div>
                    `;
                });

                dayCard.innerHTML = `
                    <div class="day-header">
                        ${day.day}
                    </div>
                    ${tasksHtml}
                `;
                container.appendChild(dayCard);
            });
            updateStats();
        }

        // Запуск
        loadState();
    </script>
</body>
</html>
